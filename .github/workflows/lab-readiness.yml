name: Lab preparation readiness (not full DQ gate)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: uv sync --group dev
      - name: Smoke prepared fixtures and support fakes
        run: uv run pytest -q tests/labs
      - name: Start disposable PostgreSQL demo
        run: docker compose up -d --wait postgres
      - name: Check Session 01 original seed
        run: docker compose exec -T postgres psql -U qa -d trading -v ON_ERROR_STOP=1 < postgres/checks/smoke.sql
      - name: Verify Session 06 baseline SQL diagnostics
        run: |
          for sql_file in exercises/06-data-quality-rules/sql/*.sql; do
            echo "Checking $sql_file"
            docker compose exec -T postgres psql -U qa -d trading -v ON_ERROR_STOP=1 < "$sql_file"
          done
      - name: Load isolated Session 10 mock fixture
        run: docker compose exec -T postgres psql -U qa -d trading -v ON_ERROR_STOP=1 < postgres/fixtures/10-sql-mock.sql
      - name: Check Session 10 mock fixture structure
        run: docker compose exec -T postgres psql -U qa -d trading -v ON_ERROR_STOP=1 < postgres/checks/lab10-smoke.sql
      - name: Validate reviewed Session 10 SQL and adversarial NULL/version scenarios
        run: |
          cat exercises/10-sql-mock/REVIEWED_SQL.sql \\
              exercises/10-sql-mock/REVIEWED_CHECKS.sql \\
            | docker compose exec -T postgres psql -U qa -d trading -v ON_ERROR_STOP=1
      - name: Assert Session 13 DQ negative control really blocks CI
        run: |
          set +e
          docker compose exec -T postgres psql -U qa -d trading -v ON_ERROR_STOP=1 \\
            < exercises/13-quality-gates-ci/REVIEWED_SQL.sql > /tmp/dq-negative-control.log 2>&1
          code=$?
          set -e
          cat /tmp/dq-negative-control.log
          if [ "$code" -eq 0 ]; then
            echo "DQ negative control falsely passed" >&2
            exit 1
          fi
          grep -q 'Session 13 DQ gate blocked' /tmp/dq-negative-control.log || {
            echo "DQ failure was not the expected business-rule failure" >&2
            exit 1
          }
      - name: Inspect postgres on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color postgres
      - name: Remove disposable demo volumes
        if: always()
        run: docker compose down -v
