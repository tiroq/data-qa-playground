name: Session 07 PostgreSQL Testcontainers integration

on:
  push:
    branches: [main]
    paths:
      - "tests/integration/**"
      - "exercises/07-pytest-architecture/notes/transaction-isolation-review.md"
      - ".github/workflows/session07-postgres-integration.yml"
  pull_request:
    paths:
      - "tests/integration/**"
      - ".github/workflows/session07-postgres-integration.yml"
  workflow_dispatch:

jobs:
  postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run PostgreSQL transaction isolation test in a disposable container
        run: |
          uv run --with 'testcontainers[postgres]>=4.10,<5' --with 'psycopg[binary]>=3.2,<4' \
            pytest -v tests/integration/test_transaction_isolation.py
