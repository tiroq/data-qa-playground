name: Streaming Data QA lab (synthetic E2E)

on:
  push:
    branches: [main]
    paths:
      - "compose.streaming.yaml"
      - "streaming/**"
      - "streaming_lab/**"
      - "scripts/streaming_lab.sh"
      - "tests/streaming/**"
      - ".github/workflows/streaming-lab.yml"
  pull_request:
    paths:
      - "compose.streaming.yaml"
      - "streaming/**"
      - "streaming_lab/**"
      - "scripts/streaming_lab.sh"
      - "tests/streaming/**"
      - ".github/workflows/streaming-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile the pure-Python lab logic
        run: python -m compileall -q streaming_lab
      - name: Synthetic data quality negative controls
        run: uv run pytest -q tests/streaming
      - name: Check Compose overlay syntax
        run: docker compose -f compose.yaml -f compose.streaming.yaml --profile clickhouse --profile streaming config --quiet
      - name: Check shell syntax
        run: bash -n scripts/streaming_lab.sh

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start Kafka KRaft + Flink + ClickHouse + PostgreSQL
        run: bash scripts/streaming_lab.sh up
      - name: Valid trades cross Kafka/Flink and are DQ verified
        run: |
          bash scripts/streaming_lab.sh seed healthy ci-healthy-${GITHUB_RUN_ID}
          bash scripts/streaming_lab.sh gate ci-healthy-${GITHUB_RUN_ID}
      - name: Missing event is detected by independent manifest
        run: |
          bash scripts/streaming_lab.sh seed missing ci-missing-${GITHUB_RUN_ID}
          bash scripts/streaming_lab.sh gate ci-missing-${GITHUB_RUN_ID} DQ-MISSING
      - name: Corrupted PnL is detected despite matching event IDs
        run: |
          bash scripts/streaming_lab.sh seed corrupt ci-corrupt-${GITHUB_RUN_ID}
          bash scripts/streaming_lab.sh gate ci-corrupt-${GITHUB_RUN_ID} DQ-PAYLOAD
      - name: Identical replay does not double-count logical events
        run: |
          bash scripts/streaming_lab.sh seed duplicate ci-replay-${GITHUB_RUN_ID}
          bash scripts/streaming_lab.sh gate ci-replay-${GITHUB_RUN_ID}
      - name: Inspect service logs on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.streaming.yaml --profile clickhouse --profile streaming ps
          docker compose -f compose.yaml -f compose.streaming.yaml --profile clickhouse --profile streaming logs --no-color --tail=120
      - name: Upload DQ evidence even if failing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: streaming-dq-evidence
          path: .streaming-runs/
          if-no-files-found: ignore
      - name: Stop test environment
        if: always()
        run: bash scripts/streaming_lab.sh down
